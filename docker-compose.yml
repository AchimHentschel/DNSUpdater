services:
  dns-updater:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dns-updater
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - USERNAME=${USERNAME:-admin}
      - PASSWORD=${PASSWORD:-password123}
      - API_KEY=${API_KEY}
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/domains/updateRecord"]
      interval: 30s
      timeout: 10s
      retries: 3
